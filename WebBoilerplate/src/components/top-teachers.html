<section class="top-teachers">
    <h1 class="section-title">Top Teachers</h1>
    <div class="filters">
        <div class="filter-group">
            <label for="age-filter">Age</label>
            <select id="age-filter" name="age">
                <option value="all">All</option>
                <option value="18-29">18-29</option>
                <option value="30-39">30-39</option>
                <option value="40-49">40-49</option>
                <option value="50-59">50-59</option>
                <option value="60-69">60-69</option>
                <option value="70-79">70-79</option>
                <option value="80-89">80-89</option>
                <option value="90-99">90-99</option>
                <option value="100-">100-</option>
            </select>
        </div>
        <span class="separator">|</span>
        <div class="filter-group">
            <label for="country-filter">Country</label>
            <select id="country-filter" name="country">
                <option value="all">All</option>
            </select>
        </div>
        <span class="separator">|</span>
        <div class="filter-group">
            <label for="sex-filter">Sex</label>
            <select id="sex-filter" name="sex">
                <option value="all">All</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <span class="separator">|</span>
        <div class="filter-group">
            <input id="photo-filter" type="checkbox" name="only-with-photo" />
            <label for="photo-filter">Only with photo</label>
        </div>
        <span class="separator">|</span>
        <div class="filter-group">
            <input id="only-favourites-filter" type="checkbox" name="only-favourites" />
            <label for="only-favourites-filter">Only favourites</label>
        </div>
    </div>
    <div class="teachers-list">
        <!-- Teacher cards will be dynamically inserted here -->
    </div>
</section>
